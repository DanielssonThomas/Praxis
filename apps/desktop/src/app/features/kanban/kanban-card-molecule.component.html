<article [attr.data-native-id]="task().nativeId">
  <h3>{{ task().task.title }}</h3>
  <p class="identity">
    {{ task().nativeId }} @if (task().assignee; as assignee) { <span>· {{ assignee }}</span> }
  </p>

  @if (task().links.length) {
    <ul aria-label="Linked GitHub issues">
      @for (issue of task().links; track issue.repository + '#' + issue.number) {
        <li>
          <button praxisButton type="button" class="issue" [disabled]="busy()"
            [attr.aria-label]="'Open ' + issue.repository + '#' + issue.number + ' in the browser'"
            (click)="open(issue)">{{ issue.repository }}#{{ issue.number }}</button>
        </li>
      }
    </ul>
  }

  @if (canLink()) {
    <form [attr.aria-label]="'Link a GitHub issue to ' + task().task.title" (submit)="submit($event, issue)">
      <label>
        GitHub issue
        <input #issue type="text" name="issue" placeholder="owner/repo#42" required maxlength="158"
          spellcheck="false" autocapitalize="none" aria-describedby="kanban-status">
      </label>
      <button praxisButton type="submit" [disabled]="busy()">Link issue</button>
    </form>
  }
</article>
