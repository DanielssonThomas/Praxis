<article [attr.data-native-id]="task().nativeId">
  @let item = task();
  @let id = triggerId(item.nativeId);
  <p class="identity" [id]="id + '-identity'">{{ item.nativeId }}</p>
  <h3>
    <button praxisButton type="button" [id]="id" aria-haspopup="dialog" aria-controls="kanban-task-details"
      [attr.aria-describedby]="id + '-identity ' + id + '-summary'"
      (click)="opened.emit(item.nativeId)">{{ item.task.title }}</button>
  </h3>
  <p class="summary" [id]="id + '-summary'">
    <span>{{ item.assignee || "Unassigned" }}</span>
    @if (item.links[0]; as issue) {
      <span class="issue">{{ issue.repository }}#{{ issue.number }}
        @if (item.links.length > 1) { <span>+{{ item.links.length - 1 }} more</span> }
      </span>
    }
  </p>
</article>
