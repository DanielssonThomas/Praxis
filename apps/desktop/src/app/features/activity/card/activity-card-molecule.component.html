<article tabindex="-1" [attr.data-request-id]="card().requestId" [attr.data-state]="card().phase.state">
  <div class="summary">
    <div class="phase"><span aria-hidden="true"></span>{{ label() }}</div>
    <h3>{{ title() }}</h3>
    <p class="target">{{ card().action.target.id }}</p>
    <p>Requested by {{ card().actorId }}</p>
    @if (detail()) { <p>{{ detail() }}</p> }
  </div>
  @switch (card().phase.state) {
    @case ("processing") {
      <button praxisButton type="button" data-action="inspect" [disabled]="busy()"
        (click)="inspectRequested.emit(card().requestId)">Inspect</button>
    }
    @case ("attention") {
      <button praxisButton #reviewButton type="button" data-action="review" [disabled]="busy()"
        (click)="startReview()">Review</button>
    }
  }
</article>
