<praxis-shell-menu [views]="views" [activeView]="navigation.view().id"
  [activityAvailable]="activity.supported" [activityOpened]="activity.opened()"
  (activityToggled)="activity.toggle()" />
<div class="workspace">
  <main>
    <praxis-host-launch />
    <router-outlet />
  </main>
  @if (activity.supported) {
    <praxis-activity-panel [hidden]="!activity.opened()" />
  }
</div>
<praxis-command-bar
  [command]="navigation.command"
  [feedback]="feedback()"
  [placeholder]="navigation.view().id === 'manager' ? 'Message the manager or type /…' : 'Type / for commands…'"
  (commandSubmitted)="submit($event)"
/>
