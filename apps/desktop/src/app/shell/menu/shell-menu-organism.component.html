<header>
  <button
    praxisButton
    #toggle
    class="menu-toggle"
    type="button"
    aria-label="Menu"
    title="Menu"
    aria-controls="main-navigation"
    [attr.aria-expanded]="open()"
    (click)="open.set(!open())"
    (keydown.arrowdown)="focusNavigation($event)"
  ><span class="menu-icon" aria-hidden="true"></span></button>
  @if (activityAvailable()) {
    <button praxisButton #activityToggle type="button" id="activity-toggle" aria-label="Activity"
      aria-controls="desktop-activity" [attr.aria-expanded]="activityOpened()"
      [attr.aria-describedby]="activityAttentionCount() ? 'activity-notice' : null" (click)="activityToggled.emit()">
      Activity
      @if (activityAttentionCount(); as count) {
        <span class="attention-count" aria-hidden="true">{{ count }}</span>
      }
    </button>
    <span id="activity-notice" class="activity-notice" role="status">
      @if (activityAttentionCount(); as count) {
        {{ count }} pending {{ count === 1 ? "approval" : "approvals" }}
      }
    </span>
  }
</header>
<nav id="main-navigation" aria-label="Main navigation" [hidden]="!open()">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <span>Praxis</span>
  </div>
  @for (section of sections(); track section.id) {
    <div class="section" role="group" [attr.aria-labelledby]="'nav-' + section.id">
      <h2 [id]="'nav-' + section.id">{{ section.label }}</h2>
      <div class="destinations">
        @for (view of section.views; track view.id) {
          <a
            #destination
            [routerLink]="['/', view.id]"
            [attr.aria-current]="activeView() === view.id ? 'page' : null"
            (click)="close($event)"
          >{{ view.label }}</a>
        }
      </div>
    </div>
  }
</nav>
