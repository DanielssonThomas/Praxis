<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praxis</title>
  <link rel="stylesheet" href="/assets/shell.css">
  <script type="module" src="/assets/shell.js"></script>
  <script type="module" src="/assets/activity.js"></script>
  <script type="module" src="/assets/kanban.js"></script>
</head>
<body data-activity="unavailable" data-kanban="unavailable">
  <header id="shell-header">
    <div class="header-row">
      <span class="brand">Praxis</span>
      <div class="header-actions">
        <button id="activity-toggle" type="button" aria-controls="activity-panel" aria-expanded="false" hidden>Activity</button>
        <button id="menu-toggle" type="button" aria-controls="main-nav" aria-expanded="false">Menu</button>
      </div>
    </div>
    <nav id="main-nav" aria-label="Main navigation" hidden>
      <a href="#manager" data-route="manager">Manager</a>
      <a href="#overview" data-route="overview">Overview</a>
      <a href="#kanban" data-route="kanban">Kanban</a>
      <a href="#settings" data-route="settings">Settings</a>
    </nav>
  </header>
  <main id="workspace">
    <section class="view" data-view="manager" aria-labelledby="manager-title">
      <h1 id="manager-title">Manager</h1>
    </section>
    <section class="view" data-view="overview" aria-labelledby="overview-title" hidden>
      <h1 id="overview-title">Overview</h1>
    </section>
    <section class="view" data-view="kanban" aria-labelledby="kanban-title" hidden>
      <div class="kanban-heading">
        <h1 id="kanban-title">Kanban</h1>
        <div class="header-actions">
          <button id="kanban-refresh" type="button" hidden>Refresh board</button>
          <button id="kanban-lock" type="button" hidden>Lock board</button>
        </div>
      </div>
      <form id="kanban-auth" aria-label="Open Kanban" autocomplete="off" hidden>
        <label>Operator token <input type="password" name="operatorToken" required></label>
        <button type="submit">Open board</button>
      </form>
      <p id="kanban-status" role="status">Configure the local Hermes board to view its tasks.</p>
      <p id="kanban-provider" hidden></p>
      <div id="kanban-columns"></div>
    </section>
    <section class="view settings-view" data-view="settings" aria-label="Settings" hidden>
      <iframe id="settings-frame" title="Praxis settings"></iframe>
    </section>
    <aside id="activity-panel" aria-labelledby="activity-title" hidden>
      <div class="activity-heading">
        <h2 id="activity-title">Activity</h2>
        <button type="button" id="activity-lock" hidden>Lock</button>
      </div>
      <form id="activity-auth" aria-label="Unlock activity" autocomplete="off">
        <label>Operator token <input type="password" name="operatorToken" required></label>
        <button type="submit">Unlock activity</button>
      </form>
      <p id="activity-message" role="status" hidden></p>
      <div id="activity-list"></div>
    </aside>
  </main>
  <footer id="command-bar">
    <form id="command-form" aria-label="Command bar" autocomplete="off">
      <output id="command-feedback" role="status" aria-live="polite" hidden></output>
      <div class="command-row">
        <input id="command" name="command" aria-label="Command" placeholder="Type /help" autocapitalize="none" spellcheck="false">
        <button type="submit">Run</button>
      </div>
    </form>
  </footer>
</body>
</html>
